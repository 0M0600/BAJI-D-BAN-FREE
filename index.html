<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'ANGE SANS TETE - FREE BAN CHECK</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Playfair+Display:ital,wght@1,700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0a;color:#e5e5e5;font-family:'JetBrains Mono',monospace;min-height:100vh;padding:20px 16px;}
  .header{display:flex;justify-content:space-between;align-items:center;opacity:0.6;font-size:10px;letter-spacing:2px;margin-bottom:60px}
  .badge{text-align:center;margin-bottom:24px}
  .badge span{border:1px solid #333;padding:8px 20px;font-size:10px;letter-spacing:3px;opacity:0.7}
  h1{font-family:'Playfair Display',serif;font-style:italic;font-size:48px;text-align:center;margin-bottom:12px;letter-spacing:-1px}
  .subtitle{text-align:center;opacity:0.5;font-size:13px;margin-bottom:50px;padding:0 20px;line-height:1.6}
  .section-label{font-size:10px;letter-spacing:3px;opacity:0.4;margin-bottom:24px;display:flex;align-items:center;gap:16px}
  .section-label:after{content:'';flex:1;height:1px;background:#222}
  label{font-size:10px;letter-spacing:2px;opacity:0.5;margin-bottom:10px;display:block}
  input{width:100%;background:#111;border:1px solid #222;padding:18px 16px;color:#fff;font-family:'JetBrains Mono',monospace;font-size:16px;outline:none;transition:0.2s}
  input:focus{border-color:#fff}
  #result{margin-top:20px;border:1px solid #222;background:#111;padding:16px;display:none}
  #result.show{display:block}
  .result-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1a1a1a;font-size:12px}
  .result-row:last-child{border:0}
  .status-safe{color:#4ade80}
  .status-banned{color:#f87171}
  button{width:100%;background:transparent;border:1px solid #e5e5e5;color:#e5e5e5;padding:18px;margin-top:24px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:3px;cursor:pointer;transition:0.2s}
  button:hover{background:#e5e5e5;color:#000}
  button:disabled{opacity:0.3;cursor:not-allowed}
  .footer{margin-top:60px;text-align:center;opacity:0.2;font-size:9px;letter-spacing:2px}
</style>
</head>
<body>
  <div class="header">
    <div>?</div>
    <div>L'ANGE SANS TETE<br><span style="opacity:0.5">FREE CHECK</span></div>
    <div>PANEL</div>
  </div>
  <div class="badge"><span>FREE FOREVER</span></div>
  <h1>FREE BAN CHECK</h1>
  <p class="subtitle">Check any WhatsApp number in seconds. Status, the time it was checked, and the ban reason — nothing else. By BAJI D JAP</p>
  <div class="section-label">CHECK NUMBER</div>
  <label>PHONE NUMBER</label>
  <input id="phone" type="tel" placeholder="+243858566669" value="+243858566669">
  <div id="result">
    <div class="result-row"><span>NUMBER</span><span id="r-number">-</span></div>
    <div class="result-row"><span>STATUS</span><span id="r-status">-</span></div>
    <div class="result-row"><span>REASON</span><span id="r-reason">-</span></div>
    <div class="result-row"><span>CHECKED AT</span><span id="r-time">-</span></div>
    <div class="result-row"><span>BY</span><span>BAJI D JAP</span></div>
  </div>
  <button id="btn" onclick="checkBan()">CHECK BAN STATUS</button>
  <div class="footer">BAJI D BAN CHECKER © 2026 - L'ANGE SANS TETE</div>
<script>
async function checkBan(){
  const phone = document.getElementById('phone').value.trim();
  const btn = document.getElementById('btn');
  const resBox = document.getElementById('result');
  if(!phone){ alert('Entre le numero'); return; }
  btn.disabled = true;
  btn.textContent = 'CHECKING...';
  resBox.classList.remove('show');
  try{
    const resp = await fetch('/api/check?number=' + encodeURIComponent(phone));
    const data = await resp.json();
    document.getElementById('r-number').textContent = data.number;
    document.getElementById('r-status').innerHTML = data.banned ? '<span class=status-banned>● BANNED</span>' : '<span class=status-safe>● SAFE / NOT BANNED</span>';
    document.getElementById('r-reason').textContent = data.reason;
    document.getElementById('r-time').textContent = data.time;
    resBox.classList.add('show');
  }catch(e){
    alert('Erreur: ' + e.message + ' - Il faut deployer sur Vercel pour que api/check.js marche');
  }
  btn.disabled = false;
  btn.textContent = 'CHECK BAN STATUS';
}
</script>
</body>
</html>
